<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #262c36;
    --text: #e6e9ef;
    --text-dim: #8b93a1;
    --accent: #4fa8ff;
    --user-bubble: #1f2833;
    --jarvis-bubble: #12283a;
    --error-bubble: #3a1414;
    --error-text: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    flex-shrink: 0;
  }
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--border);
  }
  .message.jarvis {
    align-self: flex-start;
    background: var(--jarvis-bubble);
    border: 1px solid #1c3a52;
  }
  .message.error {
    align-self: flex-start;
    background: var(--error-bubble);
    color: var(--error-text);
    border: 1px solid #5a2323;
  }
  .message.pending {
    align-self: flex-start;
    background: var(--jarvis-bubble);
    border: 1px solid #1c3a52;
    color: var(--text-dim);
    font-style: italic;
  }
  .message.task {
    align-self: flex-start;
    background: var(--jarvis-bubble);
    border: 1px solid #1c3a52;
  }
  .message.auth {
    align-self: flex-start;
    background: #332a12;
    border: 1px solid #5a4a1c;
  }
  .message .heading {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .message .meta {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .message.error .meta { color: var(--error-text); opacity: 0.8; }
  #input-row {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #text-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input:disabled { opacity: 0.6; cursor: default; }
  button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 0 16px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-button {
    background: var(--accent);
    border-color: var(--accent);
    color: #051018;
    font-weight: 600;
  }
  #send-button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #mic-button {
    color: var(--text-dim);
    cursor: not-allowed;
    opacity: 0.6;
  }
  .run-task-button, .cancel-task-button {
    display: inline-block;
    margin-top: 8px;
    margin-right: 6px;
    font-size: 12px;
    padding: 4px 10px;
  }
  .run-task-button:disabled, .cancel-task-button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .cancel-task-button {
    color: var(--error-text);
    border-color: var(--error-text);
  }
</style>
</head>
<body>
<header>JARVIS</header>
<div id="conversation"></div>
<div id="input-row">
  <input id="text-input" type="text" placeholder="Type a request..." autocomplete="off" />
  <button id="mic-button" type="button" title="Voice input coming soon" disabled>&#127908;</button>
  <button id="send-button" type="button">Send</button>
</div>
<script>
(function () {
  "use strict";

  var conversation = document.getElementById("conversation");
  var textInput = document.getElementById("text-input");
  var sendButton = document.getElementById("send-button");

  // Guards against a real ordering hazard: without this, pressing Enter twice
  // quickly (or Enter then a click) fires two concurrent requests whose
  // responses can resolve out of order, visually reordering the conversation.
  var isSending = false;

  function addMessage(role, headingText, bodyText, metaText) {
    var el = document.createElement("div");
    el.className = "message " + role;
    if (headingText) {
      var heading = document.createElement("span");
      heading.className = "heading";
      heading.textContent = headingText;
      el.appendChild(heading);
    }
    el.appendChild(document.createTextNode(bodyText));
    if (metaText) {
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = metaText;
      el.appendChild(meta);
    }
    conversation.appendChild(el);
    conversation.scrollTop = conversation.scrollHeight;
    return el;
  }

  function metaFor(data) {
    var parts = [];
    if (data.route_kind) { parts.push("route: " + data.route_kind); }
    if (data.capability_id) { parts.push("capability: " + data.capability_id); }
    return parts.join(" · ");
  }

  var TERMINAL_TASK_STATUSES = ["completed", "failed", "cancelled"];
  var TASK_POLL_INTERVAL_MS = 2000;
  var TASK_POLL_MAX_ATTEMPTS = 60; // ~2 minutes total -- a real, bounded ceiling, not forever.

  // Polls GET /api/tasks/<id> -- the real, authoritative task-store read
  // (jarvis.kernel.tasks.authorize_and_get_task) -- and appends one new,
  // real message each time the task's own real status actually changes.
  // Never fabricates progress: a status that hasn't changed since the last
  // poll produces no new message at all. Stops on a real terminal status,
  // a real fetch failure, or after TASK_POLL_MAX_ATTEMPTS -- whichever
  // comes first.
  function pollTaskStatus(taskId, lastKnownStatus, attemptsLeft) {
    if (attemptsLeft <= 0) { return; }
    setTimeout(function () {
      fetch("/api/tasks/" + encodeURIComponent(taskId))
        .then(function (response) {
          if (!response.ok) { return null; }
          return response.json();
        })
        .then(function (data) {
          if (!data) { return; }
          if (data.status && data.status !== lastKnownStatus) {
            addMessage("task", "Task " + taskId, "Status: " + data.status, null);
            lastKnownStatus = data.status;
          }
          if (TERMINAL_TASK_STATUSES.indexOf(lastKnownStatus) !== -1) { return; }
          pollTaskStatus(taskId, lastKnownStatus, attemptsLeft - 1);
        })
        .catch(function () {
          // A real, transient network failure -- stop polling quietly rather than
          // spamming the conversation with repeated error bubbles for a side effect
          // of a background status check the user never directly asked for.
        });
    }, TASK_POLL_INTERVAL_MS);
  }

  // POST /api/tasks/<id>/run (WP-112) -- a real, explicit, separate action from
  // task creation. Never sent automatically: only a real user click on the real
  // "Run" button calls this. The button stays disabled after a request that was
  // itself accepted (even if the underlying plan later fails) to avoid an easy,
  // accidental duplicate run of the same task; a real request failure (network
  // error, 404, 500) re-enables it so the user can retry.
  function runTask(taskId, button) {
    button.disabled = true;
    button.textContent = "Running...";
    fetch("/api/tasks/" + encodeURIComponent(taskId) + "/run", { method: "POST" })
      .then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        var data = result.data;
        if (!result.ok || data.type === "error") {
          addMessage(
            "error", null, (data && data.message) || "Could not run this task.", null
          );
          button.disabled = false;
          button.textContent = "Run";
          return;
        }
        button.textContent = "Started";
        addMessage("task", "Task " + taskId, "Status: " + (data.status || "running"), null);
      })
      .catch(function () {
        addMessage(
          "error", null, "Could not reach the JARVIS backend to run this task.", null
        );
        button.disabled = false;
        button.textContent = "Run";
      });
  }

  // POST /api/tasks/<id>/cancel (WP-119) -- mirrors runTask's own shape exactly.
  // Never sent automatically: only a real user click on the real "Cancel"
  // button calls this. Unlike runTask, a real refusal (e.g. the task already
  // finished) is not a network/server error -- it's a real, granted lookup
  // reporting `cancelled: false` with its own reason, shown as a real task
  // status line rather than an error bubble.
  function cancelTask(taskId, button) {
    button.disabled = true;
    button.textContent = "Cancelling...";
    fetch("/api/tasks/" + encodeURIComponent(taskId) + "/cancel", { method: "POST" })
      .then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        var data = result.data;
        if (!result.ok || data.type === "error") {
          addMessage(
            "error", null, (data && data.message) || "Could not cancel this task.", null
          );
          button.disabled = false;
          button.textContent = "Cancel";
          return;
        }
        if (data.cancelled) {
          button.textContent = "Cancelled";
          addMessage("task", "Task " + taskId, "Status: cancelled", null);
        } else {
          button.disabled = false;
          button.textContent = "Cancel";
          addMessage("task", "Task " + taskId, data.reason || "Not cancelled.", null);
        }
      })
      .catch(function () {
        addMessage(
          "error", null, "Could not reach the JARVIS backend to cancel this task.", null
        );
        button.disabled = false;
        button.textContent = "Cancel";
      });
  }

  // Renders one real backend response, distinguishing every real `type` the
  // API can return (see jarvis.cli.ui_server.build_response_payload) rather
  // than lumping every non-error response into one generic bubble.
  function renderResponse(data) {
    var message = data.message || "(no response)";
    if (data.type === "error") {
      addMessage("error", null, message, null);
      return;
    }
    if (data.type === "task_created") {
      var status = data.task_status || "created";
      var body = "Task ID: " + data.task_id + "\nStatus: " + status;
      var taskEl = addMessage("task", "Task created", body, metaFor(data));
      if (data.task_id) {
        var runButton = document.createElement("button");
        runButton.type = "button";
        runButton.className = "run-task-button";
        runButton.textContent = "Run";
        runButton.addEventListener("click", function () {
          runTask(data.task_id, runButton);
        });
        taskEl.appendChild(runButton);
        var cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "cancel-task-button";
        cancelButton.textContent = "Cancel";
        cancelButton.addEventListener("click", function () {
          cancelTask(data.task_id, cancelButton);
        });
        taskEl.appendChild(cancelButton);
        pollTaskStatus(data.task_id, status, TASK_POLL_MAX_ATTEMPTS);
      }
      return;
    }
    if (data.type === "denied") {
      addMessage("auth", "Authorization required", message, metaFor(data));
      return;
    }
    // "response" / "not_routed" / "unwired_capability" all read naturally as
    // plain text already -- no special heading needed.
    addMessage("jarvis", null, message, metaFor(data));
  }

  function send() {
    if (isSending) { return; }
    var text = textInput.value.trim();
    if (!text) { return; }

    isSending = true;
    addMessage("user", null, text, null);
    textInput.value = "";
    sendButton.disabled = true;
    textInput.disabled = true;
    var pendingEl = addMessage("pending", null, "Thinking...", null);

    fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (response) {
        return response.json().then(function (data) {
          return data;
        });
      })
      .then(function (data) {
        pendingEl.remove();
        renderResponse(data);
      })
      .catch(function () {
        pendingEl.remove();
        addMessage(
          "error", null, "I couldn't process that request. Please try again.", null
        );
      })
      .finally(function () {
        isSending = false;
        sendButton.disabled = false;
        textInput.disabled = false;
        textInput.focus();
      });
  }

  sendButton.addEventListener("click", send);
  textInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      send();
    }
  });

  addMessage("jarvis", null, "JARVIS UI foundation. Type a request below.", null);
  textInput.focus();
})();
</script>
</body>
</html>
