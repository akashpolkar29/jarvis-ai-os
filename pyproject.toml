[project]
name = "jarvis"
version = "0.1.0.dev0"
description = "Privacy-first, plugin-based agent kernel for Linux."
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "jeepney>=0.9.0",
    "openwakeword==0.6.0",
    "ai-edge-litert",
    "sounddevice",
    "numpy",
    "platformdirs",
    "onnxruntime",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    "piper-tts",
    "pygobject>=3.56.3",
    "fastembed>=0.8.0",
    "websockets>=17.1",
    "caldav>=3.2.1",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
# openwakeword>=0.5.0 declares a hard, unconditional-on-Linux dependency
# on tflite-runtime, whose last-ever PyPI wheel supports up to Python
# 3.11 only -- no cp312/cp313 wheel exists at all (see
# poc/wp19_03_wakeword_smoke.py for the empirical trail: WP-19 hit this
# as a real resolver failure, not a hypothetical). This override
# replaces that requirement with an always-false marker, which is not a
# version-pin trick -- it makes uv treat the requirement as never
# applicable, so resolution succeeds without needing a real
# tflite-runtime install at all. ai-edge-litert (a real dependency,
# above) is what actually provides the interpreter at runtime, via the
# tflite_runtime compatibility shim in adapters/wake_word.py.
override-dependencies = ["tflite-runtime; python_version < '0'"]

[tool.uv.workspace]
members = ["plugins/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    "import-linter",
    "pre-commit",
    "cosmic-ray>=8.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
    "TC",  # flake8-type-checking
    "S",   # flake8-bandit
    "T20", # flake8-print
    "DTZ", # flake8-datetimez
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are not a public API surface: skip docstring and bandit noise
# (assert usage, hardcoded test fixtures, etc).
"tests/**" = ["D", "S"]
# The CLI's whole job is printing to the terminal -- T20 exists to
# catch stray debug prints in library code, not to forbid a CLI's
# actual user-facing output.
"src/jarvis/cli/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Non-deterministic / wall-clock and randomness sources are banned in favor
# of ClockPort / IdPort injection (see docs/adr). This catches the direct
# `from x import y` import forms; attribute-style calls after a bare
# `import datetime` / `import time` / `import uuid` are NOT visible to this
# rule and are instead caught by the AST-based
# tests/meta/test_source_invariants.py.
"datetime.datetime.now" = { msg = "Inject ClockPort instead of datetime.now()." }
"datetime.datetime.utcnow" = { msg = "Inject ClockPort instead of datetime.utcnow()." }
"time.time" = { msg = "Inject ClockPort instead of time.time()." }
"time.monotonic" = { msg = "Inject ClockPort instead of time.monotonic()." }
"uuid.uuid1" = { msg = "Inject IdPort instead of uuid.uuid1()." }
"uuid.uuid4" = { msg = "Inject IdPort instead of uuid.uuid4()." }

[tool.mypy]
strict = true
warn_unreachable = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
# jeepney ships no py.typed marker (its source is annotated, but it
# doesn't opt in to being type-checked by consumers), so mypy strict
# treats every import from it as untyped.
module = "jeepney.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sounddevice and openwakeword ship no py.typed marker / type stubs
# either -- both used only via lazy imports inside
# adapters/wake_word.py's real-hardware path (see that module's
# docstring for why the imports are lazy in the first place).
module = ["sounddevice.*", "openwakeword.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime, faster_whisper, and nvidia-cublas-cu12/nvidia-cudnn-cu12
# (the nvidia.* namespace packages) ship no py.typed marker / type
# stubs either -- all used only via lazy imports inside
# adapters/vad.py's and adapters/stt.py's real-hardware paths (see
# those modules' docstrings for why the imports are lazy).
module = ["onnxruntime.*", "faster_whisper.*", "nvidia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# piper (piper-tts) ships no py.typed marker / type stubs either -- used
# only via a lazy import inside adapters/tts.py's real-hardware path (see
# that module's docstring for why the import is lazy).
module = "piper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gi (PyGObject) ships no py.typed marker / type stubs either -- used
# only via a lazy import inside ui/confirm/dialog.py's real-display path
# (see that module's docstring for why the import is lazy).
module = "gi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
branch = true
source = ["src/jarvis"]

[tool.importlinter]
root_packages = ["jarvis"]
include_external_packages = true

# NOTE: The contract for plugin isolation (C3) is intentionally NOT
# configured yet: import-linter errors on a contract naming a package
# that does not yet exist on disk, and plugins/* is not a real workspace
# member yet. See tests/meta/test_gate_integrity.py::CONTRACT_SCHEDULE
# for when it is due. C5 (ui privilege) is configured below as of WP-24,
# now that jarvis.ui exists. C4 (adapter independence) is configured
# below as of WP-32, now that jarvis.adapters.reasoning -- this repo's
# first real per-adapter subpackage -- exists.

[[tool.importlinter.contracts]]
name = "C1 layered architecture"
type = "layers"
layers = [
    "jarvis.cli",
    "jarvis.kernel",
    "jarvis.ipc",
    "jarvis.adapters",
    "jarvis.application",
    "jarvis.ports",
    "jarvis.domain",
    "jarvis.ui",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "C2 domain purity"
type = "forbidden"
source_modules = ["jarvis.domain"]
forbidden_modules = [
    "jarvis.ports",
    "jarvis.application",
    "jarvis.adapters",
    "jarvis.plugin_api",
    "jarvis.kernel",
    "jarvis.ipc",
    "jarvis.cli",
]

[[tool.importlinter.contracts]]
name = "C6 no GLib in the core"
type = "forbidden"
source_modules = ["jarvis.domain", "jarvis.application", "jarvis.kernel"]
forbidden_modules = ["gi"]

[[tool.importlinter.contracts]]
name = "C7 plugin_api depends only on domain"
type = "forbidden"
source_modules = ["jarvis.plugin_api"]
forbidden_modules = [
    "jarvis.application",
    "jarvis.adapters",
    "jarvis.kernel",
    "jarvis.ipc",
    "jarvis.cli",
]

[[tool.importlinter.contracts]]
name = "C5 ui privilege"
type = "forbidden"
source_modules = ["jarvis.ui"]
forbidden_modules = [
    "jarvis.domain",
    "jarvis.ports",
    "jarvis.application",
    "jarvis.adapters",
    "jarvis.kernel",
    "jarvis.ipc",
    "jarvis.cli",
]

[[tool.importlinter.contracts]]
name = "C4 adapter independence"
type = "independence"
modules = [
    "jarvis.adapters.reasoning.family_a",
    "jarvis.adapters.reasoning.family_b",
    "jarvis.adapters.reasoning.local",
    "jarvis.adapters.reasoning.cassette",
    "jarvis.adapters.validation.build",
    "jarvis.adapters.validation.pytest_validator",
    "jarvis.adapters.validation.static",
    "jarvis.adapters.validation.runtime",
    "jarvis.adapters.validation.user_script",
]
