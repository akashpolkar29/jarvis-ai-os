name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      # pygobject (PyGObject) ships no prebuilt wheels on PyPI -- source
      # distribution only, requiring a C compiler and these headers to
      # build. Confirmed empirically against this exact runner image:
      # ubuntu-latest resolves to Ubuntu 24.04 (noble), matching the dev
      # machine these package names/versions were verified on directly
      # (libgirepository-2.0-dev 2.80.0, libcairo2-dev 1.18.0). PyGObject
      # 3.51+ (this project pins >=3.56.3) requires libgirepository-2.0,
      # not the older libgirepository1.0-dev most guides still show.
      # gir1.2-gtk-4.0 is the GTK4 typelib itself, needed at runtime for
      # gi.require_version("Gtk", "4.0") to resolve -- separate from the
      # build-time headers above. No display/xvfb is needed: no test in
      # this project instantiates a GTK widget or opens a display (see
      # jarvis.ui.confirm.dialog's own module docstring).
      #
      # bubblewrap (WP-45, ADR-0044) provides the real bwrap binary
      # BwrapSandboxAdapter's own tests execute for real (matching this
      # repo's "git is a reliable CI dependency" pattern for
      # LocalWorkspaceAdapter).
      #
      # libportaudio2 (real dependency-portability finding, 5-mixed-real-
      # tasks pass, 2026-09-05): `sounddevice` (imported at module level
      # by kernel/voice_loop.py, adapters/wake_word.py, and
      # adapters/candidate_presentation.py, all reachable during test
      # collection) is a pure-Python ctypes binding with no bundled
      # binary -- it `dlopen`s the real system `libportaudio.so.2`,
      # confirmed directly by checking the installed wheel contains no
      # `.so` of its own. CI was passing only because `ubuntu-latest`
      # happens to ship this library by default already -- a real,
      # previously undeclared dependency on the runner image's own
      # contents, not a genuine absence of the requirement. Declared
      # explicitly here now, matching this step's own stated discipline
      # for PyGObject/bwrap.
      - name: Install system dependencies (PyGObject build + GTK4 runtime + bwrap + libportaudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-gtk-4.0 \
            bubblewrap \
            libportaudio2

      # Real, confirmed CI failure (every WP-45+ run, both matrix legs) fixed
      # here, not merely anticipated: bwrap successfully creates its
      # unprivileged user+network namespace on this runner (Ubuntu's own
      # bubblewrap AppArmor profile already permits that much), but the
      # netlink RTM_NEWADDR call it makes next -- bringing up the sandbox's
      # own loopback interface -- fails with EPERM, because Ubuntu 23.10+'s
      # kernel.apparmor_restrict_unprivileged_userns=1 default (which
      # ubuntu-latest/24.04 runner images ship) denies CAP_NET_ADMIN inside
      # that namespace regardless of the profile permitting the namespace's
      # creation. Real error observed directly in CI logs before this fix:
      # "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted".
      # Confirmed as a known, widely-reported issue (not specific to this
      # repo or this adapter) -- OpenAI Codex, Claude Code, and multiple
      # other bwrap-based sandboxes hit the identical error on GitHub-hosted
      # runners. The runner's default `runner` user has passwordless sudo,
      # so this sysctl write succeeds and is scoped to this ephemeral
      # runner VM's own lifetime only -- it does not touch what the bwrap
      # sandbox itself contains once created (SandboxPort's own network/
      # filesystem isolation guarantees, ADR-0044, are unaffected; this
      # only concerns bwrap's own ability to finish *setting up* the
      # sandbox). Verified live on a real ubuntu-latest runner, both matrix
      # legs, before landing here: with this step present, every
      # BwrapSandboxAdapter test (real network denial, real filesystem
      # denial, real bind-path writes, real exit-code capture, real
      # non-blocking launch()) passes for real, not skipped or weakened.
      - name: Allow bwrap's unprivileged network-namespace loopback setup
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Real, local, credential-free IMAP/CalDAV test servers for
      # tests/integration/test_email_calendar_against_local_servers.py
      # (Track 1, 2026-09-04) -- closes the actual "live-credential-
      # gated integration test remains unmet" gap named repeatedly in
      # past reports, with a real local server instead of real
      # credentials. Launched as plain `docker run` steps here, not a
      # job-level `services:` block: GitHub Actions starts service
      # containers before any step (including checkout) runs, so a
      # `services:`-level volume mount of Radicale's own config file
      # (checked out by the step above, not yet present when services
      # start) would not reliably be readable at Radicale's own
      # startup. Running them as ordinary steps after checkout avoids
      # that real ordering problem entirely.
      - name: Start local GreenMail IMAP/SMTP test server
        run: |
          docker run -d --name jarvis-test-greenmail \
            -e GREENMAIL_OPTS="-Dgreenmail.setup.test.all -Dgreenmail.users=testuser:testpass@localhost -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled" \
            -p 3025:3025 -p 3143:3143 -p 3110:3110 \
            greenmail/standalone:latest
          ready=""
          for _ in $(seq 1 30); do
            # A real IMAP4 protocol handshake, not just a TCP accept -- a real,
            # empirically-found gap (adapter-resilience pass, 2026-09-05):
            # GreenMail's own JVM can accept a TCP connection on this port
            # before its IMAP service has actually finished initializing,
            # causing a real imaplib.IMAP4.abort ("socket error: EOF") on the
            # very first handshake read if a test proceeds on a bare TCP-ready
            # signal alone. Mirrors tests/integration/test_adapter_failure_resilience.py's
            # own _real_greenmail_imap_handshake_succeeds() fix exactly.
            if python3 -c "
          import imaplib
          imaplib.IMAP4('127.0.0.1', 3143).shutdown()
          " >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::GreenMail never completed a real IMAP handshake on 127.0.0.1:3143 within 30s"
            docker logs jarvis-test-greenmail || true
            exit 1
          fi

      - name: Start local Radicale CalDAV test server
        run: |
          docker run -d --name jarvis-test-radicale \
            -p 5232:5232 \
            -v "$(pwd)/tests/fixtures/radicale-config:/config:ro" \
            tomsquest/docker-radicale:latest
          ready=""
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5232/ || true)
            if [ -n "$status" ] && [ "$status" != "000" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Radicale never became reachable on 127.0.0.1:5232 within 30s"
            docker logs jarvis-test-radicale || true
            exit 1
          fi

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict src tests

      - name: lint-imports
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: coverage report (domain)
        run: uv run coverage report --include="src/jarvis/domain/*" --fail-under=100

      - name: coverage report (application.policy)
        run: uv run coverage report --include="src/jarvis/application/policy/*" --fail-under=100

      - name: coverage report (application.reasoning)
        run: uv run coverage report --include="src/jarvis/application/reasoning/*" --fail-under=100

      # Real, generated API reference (Phase 3, 10-phase pass, 2026-09-05) --
      # a cheap, local `sphinx-build`, confirming it succeeds (exit 0), not
      # that it is warning-free: docs/api/conf.py's own comments explain the
      # ~12 remaining warnings, all one understood, benign, structural cause
      # (autodoc documenting a re-exported name at both its defining
      # submodule and its package's own public __all__ surface) -- not a
      # missing/stale docstring. No external hosting; docs/api/_build/ is a
      # local build artifact only, gitignored, rebuilt fresh here each run.
      - name: sphinx-build (API reference)
        run: uv run sphinx-build -b html docs/api docs/api/_build
